# CI — integración continua.
#
# En cada push (cualquier rama) o pull request, una máquina limpia descarga las
# dependencias, analiza el código y ejecuta las pruebas. Si algo falla, GitHub
# marca la subida con una ✗ roja.
#
# Este workflow NO publica nada: el APK se publica con release-apk.yml al subir
# una etiqueta de versión (v…).

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descargar las dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar las pruebas
        run: flutter test

      - name: Probar el servidor del asistente (Node)
        run: node --test asistente-server/asistente-server.test.js

# Entrega continua (CD): compila, prueba y publica el APK de la app.
#
# Relación con el otro workflow:
#   - ci.yml       → CI, corre en CADA cambio (push o pull request): analiza y prueba.
#   - este archivo → CD, corre en CADA VERSIÓN (etiqueta «v…»): vuelve a verificar,
#                    compila el APK de release y lo publica en un Release de GitHub.
#
# Se ejecuta de dos formas:
#   1. Al subir una etiqueta que empiece con «v» (por ejemplo, v1.0.0): además de
#      compilar, crea un Release en GitHub y le adjunta el APK.
#   2. A mano, desde la pestaña Actions → «Release APK» → «Run workflow»: solo
#      compila y deja el APK como artefacto (sin Release).
#
# Las direcciones de los servidores se pueden cambiar sin tocar este archivo: en
# GitHub, Settings → Secrets and variables → Actions → Variables → API_BASE_URL y
# LLM_BACKEND_URL. Si no existen, se usan las del emulador Android (10.0.2.2).
# (Son direcciones, no secretos: la app no lleva ninguna clave.)

name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # necesario para crear el Release y adjuntar el APK

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descargar las dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar las pruebas
        run: flutter test

      - name: Probar el servidor del asistente (Node)
        run: node --test asistente-server/asistente-server.test.js

      - name: Compilar el APK de release
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://10.0.2.2:8000' }}
          --dart-define=LLM_BACKEND_URL=${{ vars.LLM_BACKEND_URL || 'http://10.0.2.2:3000' }}

      - name: Renombrar el APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/control-inventario-${{ github.ref_name }}.apk

      - name: Guardar el APK como artefacto de la ejecución
        uses: actions/upload-artifact@v7
        with:
          name: control-inventario-apk
          path: build/app/outputs/flutter-apk/control-inventario-*.apk

      - name: Publicar el Release con el APK (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/control-inventario-*.apk
          generate_release_notes: true
